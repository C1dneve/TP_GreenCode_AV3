name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Node.js 24, PostgreSQL 17 e Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: greencode
          POSTGRES_PASSWORD: greencode_ci
          POSTGRES_DB: greencode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greencode -d greencode_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://greencode:greencode_ci@localhost:5432/greencode_test?schema=public
      REDIS_URL: redis://localhost:6379
      REPORTS_DIR: ./storage/reports
      JWT_SECRET: ci-only-secret-with-more-than-32-characters
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        id: setup_node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Validate Prisma schema
        id: prisma_validate
        if: always() && steps.install.outcome == 'success'
        run: npm run prisma:validate

      - name: Generate Prisma Client
        id: prisma_generate
        if: always() && steps.install.outcome == 'success' && steps.prisma_validate.outcome == 'success'
        run: npm run prisma:generate

      - name: Apply PostgreSQL migrations
        id: db_deploy
        if: always() && steps.prisma_generate.outcome == 'success'
        run: npm run db:deploy

      # Prisma Client is already generated above. This avoids generating it a second time.
      - name: Seed isolated test database
        id: db_seed
        if: always() && steps.db_deploy.outcome == 'success'
        run: npm run db:seed:generated

      # Compilation is independent of the database seed, so it still runs when seed fails.
      - name: Build TypeScript
        id: build
        if: always() && steps.prisma_generate.outcome == 'success'
        run: npm run build:ts

      - name: Unit tests
        id: unit_tests
        if: always() && steps.build.outcome == 'success'
        run: npm run test:unit:dist

      # Demonstration tests use deterministic doubles and need only the successful build.
      - name: Demonstrative scenarios and report
        id: demonstration
        if: always() && steps.build.outcome == 'success'
        run: npm run test:demonstracao:dist

      # These tests connect to the actual PostgreSQL 17 and Redis 7 services above.
      - name: Integration tests with PostgreSQL 17 and Redis 7
        id: integration_tests
        if: always() && steps.build.outcome == 'success' && steps.db_deploy.outcome == 'success'
        run: npm run test:integration:dist

      # The checked-in base report remains available even when build/demo cannot run.
      # If the demonstration process ended before writing this CI attempt, append an explicit status.
      - name: Record unavailable demonstration result when necessary
        id: evidence_fallback
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          PRISMA_VALIDATE_OUTCOME: ${{ steps.prisma_validate.outcome }}
          PRISMA_GENERATE_OUTCOME: ${{ steps.prisma_generate.outcome }}
          DB_DEPLOY_OUTCOME: ${{ steps.db_deploy.outcome }}
          DB_SEED_OUTCOME: ${{ steps.db_seed.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UNIT_OUTCOME: ${{ steps.unit_tests.outcome }}
          DEMO_OUTCOME: ${{ steps.demonstration.outcome }}
          INTEGRATION_OUTCOME: ${{ steps.integration_tests.outcome }}
        run: |
          set -euo pipefail
          report="docs/evidencias-testes-av3.md"
          mkdir -p docs
          if [ ! -s "$report" ]; then
            cat > "$report" <<'REPORT_EOF'
          # Evidências de testes — GreenCode AV3

          Este arquivo é preservado entre execuções e recebe novos registros ao final.
          REPORT_EOF
          fi

          summary_marker="## Resumo da validação CI ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          if ! grep -Fq "$summary_marker" "$report"; then
            {
              echo
              echo "---"
              echo
              echo "$summary_marker"
              echo
              echo "- Data UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "- Commit: ${GITHUB_SHA:-não disponível}"
              echo "- Node.js: $(node --version 2>/dev/null || echo 'não instalado')"
              echo "- npm ci: ${INSTALL_OUTCOME:-não executado}"
              echo "- Prisma validate: ${PRISMA_VALIDATE_OUTCOME:-não executado}"
              echo "- Prisma generate: ${PRISMA_GENERATE_OUTCOME:-não executado}"
              echo "- Migrations PostgreSQL: ${DB_DEPLOY_OUTCOME:-não executado}"
              echo "- Seed: ${DB_SEED_OUTCOME:-não executado}"
              echo "- Build TypeScript: ${BUILD_OUTCOME:-não executado}"
              echo "- Testes unitários: ${UNIT_OUTCOME:-não executado}"
              echo "- Demonstração: ${DEMO_OUTCOME:-não executado}"
              echo "- Integração PostgreSQL/Redis: ${INTEGRATION_OUTCOME:-não executado}"
              echo
              echo "Os valores acima são os resultados de conclusão dos passos do GitHub Actions: success, failure ou skipped. skipped indica que a etapa não foi executada, conforme suas dependências."
            } >> "$report"
          fi

          run_marker="Execução GitHub Actions: ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          if ! grep -Fq "$run_marker" "$report"; then
            {
              echo
              echo "### Demonstração não registrada nesta execução"
              echo
              if [ "$BUILD_OUTCOME" != "success" ]; then
                echo "- Demonstração: **NÃO EXECUTADA**; o build não foi concluído com sucesso."
              else
                echo "- Demonstração: **INTERROMPIDA/SEM RELATÓRIO**; o processo não registrou a execução antes de terminar."
              fi
              echo "- Resultado: não há evidência suficiente para classificar cenários demonstrativos como aprovados."
            } >> "$report"
          fi

      - name: Upload test evidence
        id: upload_evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: greencode-av3-evidencias-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/evidencias-testes-av3.md
          if-no-files-found: warn
          retention-days: 14

  docker-compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A unique Compose project owns only volumes created for this CI run.
      COMPOSE_PROJECT_NAME: greencode-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Build and verify API + PostgreSQL with Docker Compose
        id: compose_smoke
        shell: bash
        run: |
          set -Eeuo pipefail

          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              echo "::group::Docker Compose diagnostics (failure)"
              docker compose logs --no-color --tail=200 api postgres || true
              echo "::endgroup::"
            fi
            # COMPOSE_PROJECT_NAME is unique to this run, so these volumes are CI-owned.
            docker compose down --volumes --remove-orphans >/dev/null 2>&1 || true
            rm -f .env
            exit "$status"
          }
          trap cleanup EXIT

          # These credentials are throwaway values for this isolated CI run only.
          cat > .env <<'ENV_EOF'
          POSTGRES_USER=greencode_ci_smoke
          POSTGRES_PASSWORD=ci_smoke_only_2026
          POSTGRES_DB=greencode_smoke
          JWT_SECRET=ci-smoke-only-jwt-secret-0123456789-abcdef
          BOOTSTRAP_ADMIN_USERNAME=ci_smoke_admin
          BOOTSTRAP_ADMIN_NAME=CI Smoke Administrator
          BOOTSTRAP_ADMIN_PASSWORD=CI-Smoke-Admin-Pass-2026!
          ENV_EOF

          docker compose config -q
          docker compose build api
          docker compose up -d postgres

          postgres_id="$(docker compose ps --all --quiet postgres)"
          if [ -z "$postgres_id" ]; then
            echo "PostgreSQL container was not created." >&2
            exit 1
          fi

          postgres_healthy=false
          for attempt in $(seq 1 60); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$postgres_id" 2>/dev/null || true)"
            state="$(docker inspect --format '{{.State.Status}}' "$postgres_id" 2>/dev/null || true)"
            if [ "$health" = "healthy" ]; then
              postgres_healthy=true
              break
            fi
            if [ "$state" = "exited" ] || [ "$health" = "unhealthy" ]; then
              echo "PostgreSQL did not become healthy (state=$state, health=$health)." >&2
              exit 1
            fi
            sleep 2
          done
          if [ "$postgres_healthy" != "true" ]; then
            echo "Timed out waiting for PostgreSQL healthcheck." >&2
            exit 1
          fi

          docker compose up -d api
          api_healthy=false
          for attempt in $(seq 1 120); do
            api_id="$(docker compose ps --all --quiet api)"
            if [ -n "$api_id" ]; then
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$api_id" 2>/dev/null || true)"
              state="$(docker inspect --format '{{.State.Status}}' "$api_id" 2>/dev/null || true)"
              if [ "$state" = "exited" ] || [ "$health" = "unhealthy" ]; then
                echo "API did not become healthy (state=$state, health=$health)." >&2
                exit 1
              fi
              if response="$(curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3000/health 2>/dev/null)" \
                && [ "$health" = "healthy" ] \
                && [[ "$response" == *'"status":"ok"'* ]] \
                && [[ "$response" == *'"service":"greencode-api"'* ]]; then
                api_healthy=true
                break
              fi
            fi
            sleep 2
          done

          if [ "$api_healthy" != "true" ]; then
            echo "Timed out waiting for a healthy API and successful GET /health." >&2
            exit 1
          fi
          echo "Docker Compose smoke test passed: PostgreSQL healthy and GET /health returned HTTP 2xx with the expected service payload."
